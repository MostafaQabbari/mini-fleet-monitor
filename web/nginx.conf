server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml;

  # vite puts a content hash in these file names, so they can be cached forever
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # react router handles /login etc. in the browser, so unknown paths get index.html.
  # no-cache makes the browser revalidate it, so a new deploy is picked up right away
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
